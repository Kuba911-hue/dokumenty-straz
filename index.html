<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Służba w Straży Granicznej – Kompletowanie Dokumentów</title>
    <style>
        :root {
            --bg-color: #0b100c;
            --card-bg: #121c14;
            --card-border: #233526;
            --accent-gold: #c5a059;
            --text-main: #f0f4f1;
            --text-muted: #8e9e91;
            --success-bg: rgba(34, 197, 94, 0.08);
            --success-border: #22c55e;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 12px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 28px 22px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 20px;
        }

        .logo-wrapper {
            margin: 0 auto 16px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-sg {
            width: 110px;
            height: auto;
            max-height: 130px;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: #ffffff;
            margin: 0 0 6px 0;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.35;
        }

        /* Progress Bar */
        .progress-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 20px;
        }

        .progress-title {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            font-size: 0.82rem;
            color: var(--accent-gold);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .progress-bar {
            background: #080c09;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #9a7b38 0%, var(--accent-gold) 100%);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Checklist */
        .checklist {
            list-style: none;
            padding: 0;
            margin: 0 0 24px 0;
        }

        .item {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .item.completed {
            background: var(--success-bg);
            border-color: var(--success-border);
        }

        .item.completed label {
            color: var(--text-muted);
            opacity: 0.75;
            text-decoration: line-through;
        }

        .checkbox-container {
            position: relative;
            width: 22px;
            height: 22px;
            margin-right: 14px;
            flex-shrink: 0;
        }

        .item input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid var(--text-muted);
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
            outline: none;
            margin: 0;
            display: block;
            transition: all 0.2s ease;
        }

        .item input[type="checkbox"]:checked {
            background-color: var(--success-border);
            border-color: var(--success-border);
        }

        .item input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 7px;
            top: 3px;
            width: 5px;
            height: 10px;
            border: solid #ffffff;
            border-width: 0 2.5px 2.5px 0;
            transform: rotate(45deg);
        }

        .item label {
            cursor: pointer;
            line-height: 1.4;
            font-size: 0.9rem;
            color: var(--text-main);
            flex-grow: 1;
        }

        /* Notes Section */
        .notes-section {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
        }

        .notes-section h2 {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-gold);
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        textarea {
            width: 100%;
            height: 110px;
            padding: 12px;
            background: #080c09;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.88rem;
            line-height: 1.4;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent-gold);
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .status-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background-color: #22c55e;
            border-radius: 50%;
            margin-right: 6px;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-wrapper">
                <!-- Oficjalny Plik Symbolu Straży Granicznej bezpośrednio z Wikimedia Commons -->
                <img class="logo-sg" src="https://upload.wikimedia.org/wikipedia/commons/2/2a/POL_Logo_Stra%C5%BCy_Granicznej.svg" alt="Logo Straży Granicznej">
            </div>
            <h1>Rzeczpospolita Polska</h1>
            <div class="subtitle">Wykaz Dokumentów Kandydata do Służby w Straży Granicznej</div>
        </div>

        <div class="progress-box">
            <div class="progress-title">
                <span>Stan skompletowania</span>
                <span id="progress-text">0 / 10 (0%)</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>

        <ul class="checklist">
            <li class="item" onclick="toggleCheckbox(0, event)">
                <div class="checkbox-container">
                    <input type="checkbox" class="doc-check" id="doc_0" onchange="saveState()">
                </div>
                <label for="doc_0">Wypełniony kwestionariusz osobowy</label>
            </li>
            <li class="item" onclick="toggleCheckbox(1, event)">
                <div class="checkbox-container">
                    <input type="checkbox" class="doc-check" id="doc_1" onchange="saveState()">
                </div>
                <label for="doc_1">Aktualna, kolorowa fotografia w formacie wymaganym do dowodu osobistego</label>
            </li>
            <li class="item" onclick="toggleCheckbox(2, event)">
                <div class="checkbox-container">
                    <input type="checkbox" class="doc-check" id="doc_2" onchange="saveState()">
                </div>
                <label for="doc_2">Kserokopia dowodu osobistego (oryginał do wglądu)</label>
            </li>
            <li class="item" onclick="toggleCheckbox(3, event)">
                <div class="checkbox-container">
                    <input type="checkbox" class="doc-check" id="doc_3" onchange="saveState()">
                </div>
                <label for="doc_3">Kserokopia książeczki wojskowej, o ile kandydat jest objęty ewidencją wojskową (oryginał do wglądu)</label>
            </li>
            <li class="item" onclick="toggleCheckbox(4, event)">
                <div class="checkbox-container">
                    <input type="checkbox" class="doc-check" id="doc_4" onchange="saveState()">
                </div>
                <label for="doc_4">Kserokopia legitymacji służbowej – dotyczy żołnierzy zawodowych (oryginał do wglądu)</label>
            </li>
            <li class="item" onclick="toggleCheckbox(5, event)">
                <div class="checkbox-container">
                    <input type="checkbox" class="doc-check" id="doc_5" onchange="saveState()">
                </div>
                <label for="doc_5">Kserokopie świadectw pracy lub służby z poprzednich miejsc pracy lub służby (oryginały do wglądu)</label>
            </li>
            <li class="item" onclick="toggleCheckbox(6, event)">
                <div class="checkbox-container">
                    <input type="checkbox" class="doc-check" id="doc_6" onchange="saveState()">
                </div>
                <label for="doc_6">Zaświadczenie o niekaralności z KRK, wydane nie wcześniej niż 6 miesięcy przed złożeniem podania</label>
            </li>
            <li class="item" onclick="toggleCheckbox(7, event)">
                <div class="checkbox-container">
                    <input type="checkbox" class="doc-check" id="doc_7" onchange="saveState()">
                </div>
                <label for="doc_7">Kserokopie dokumentów potwierdzających wykształcenie i kwalifikacje zawodowe (oryginały do wglądu)</label>
            </li>
            <li class="item" onclick="toggleCheckbox(8, event)">
                <div class="checkbox-container">
                    <input type="checkbox" class="doc-check" id="doc_8" onchange="saveState()">
                </div>
                <label for="doc_8">Kserokopie odpisów skróconego aktu urodzenia oraz aktu małżeństwa (o ile dotyczy) (oryginały do wglądu)</label>
            </li>
            <li class="item" onclick="toggleCheckbox(9, event)">
                <div class="checkbox-container">
                    <input type="checkbox" class="doc-check" id="doc_9" onchange="saveState()">
                </div>
                <label for="doc_9">Kserokopia paszportu, o ile kandydat go posiada (oryginał do wglądu)</label>
            </li>
        </ul>

        <div class="notes-section">
            <h2>Uwagi i Notatki Własne</h2>
            <textarea id="notes" placeholder="Wpisz tutaj uwagi, terminy lub przypomnienia..." oninput="saveState()"></textarea>
        </div>

        <div class="footer">
            <span class="status-dot"></span>Synchronizacja chmurowa w czasie rzeczywistym
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDDRj6R-yDpv1fDdkdFE1q9eAVAIxUuALU",
            authDomain: "dokumenty-straz.firebaseapp.com",
            databaseURL: "https://dokumenty-straz-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "dokumenty-straz",
            storageBucket: "dokumenty-straz.firebasestorage.app",
            messagingSenderId: "621777583705",
            appId: "1:621777583705:web:ce3010e6b5aa265e823b48"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const docRef = database.ref('checklist_data');

        const checkboxes = document.querySelectorAll('.doc-check');
        const notesTextarea = document.getElementById('notes');
        const progressText = document.getElementById('progress-text');
        const progressFill = document.getElementById('progress-fill');

        function toggleCheckbox(idx, event) {
            if (event.target.tagName !== 'INPUT') {
                const cb = document.getElementById('doc_' + idx);
                cb.checked = !cb.checked;
                saveState();
            }
        }

        function saveState() {
            const state = {};
            checkboxes.forEach((cb, i) => {
                state['cb_' + i] = cb.checked;
            });
            state['notes'] = notesTextarea.value;
            docRef.set(state);
        }

        docRef.on('value', (snapshot) => {
            const state = snapshot.val();
            if (state) {
                checkboxes.forEach((cb, i) => {
                    if (state['cb_' + i] !== undefined) {
                        cb.checked = state['cb_' + i];
                    }
                });
                if (state['notes'] !== undefined && document.activeElement !== notesTextarea) {
                    notesTextarea.value = state['notes'];
                }
                updateUI();
            }
        });

        function updateUI() {
            const total = checkboxes.length;
            let checkedCount = 0;

            checkboxes.forEach((cb) => {
                const parent = cb.closest('.item');
                if (cb.checked) {
                    checkedCount++;
                    parent.classList.add('completed');
                } else {
                    parent.classList.remove('completed');
                }
            });

            const percent = Math.round((checkedCount / total) * 100);
            progressText.innerText = `${checkedCount} / ${total} (${percent}%)`;
            progressFill.style.width = `${percent}%`;
        }
    </script>
</body>
</html>
